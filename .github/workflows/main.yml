name: CI

on: [push]

# A new push to a branch cancels the CI run still going for that branch. On
# main this means only the newest of several quick merges is tested and
# deployed: the Deploy workflow skips cancelled runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Run rubocop
      run: bundle exec rubocop

  assets:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
    - name: Install system dependencies via apt
      run: sudo apt-get update && sudo apt-get install --fix-missing -y rsync

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Cache npm
      uses: actions/cache@v6
      env:
        cache-name: cache-npm
      with:
        path: ./node_modules
        key: ${{ env.cache-name }}-v1-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ env.cache-name }}-

    - name: Install js dependencies
      run: yarn

    - name: Precompile assets
      run: bundle exec rails assets:precompile

  test_unit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bezirkr
          POSTGRES_PASSWORD: bezirkr
        ports:
        - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis
        ports:
        - 6379:6379
        options: --entrypoint redis-server

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
    - name: Install system dependencies via apt
      run: sudo apt-get update && sudo apt-get install --fix-missing -y rsync

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Cache npm
      uses: actions/cache@v6
      env:
        cache-name: cache-npm
      with:
        path: ./node_modules
        key: ${{ env.cache-name }}-v1-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ env.cache-name }}-

    - name: Install js dependencies
      run: yarn

    - name: Prepare DB
      run: bundle exec rails db:create
      env:
        RAILS_ENV: test
    - name: Load schema
      run: bundle exec rails db:schema:load
      env:
        RAILS_ENV: test

    - name: Run unit tests
      run: bundle exec rails test
      env:
        COVERAGE: on
        CI: on

    - name: Store test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: Test Results
        path: test/reports
    - name: Store logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Logs
        path: log


  test_system:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: bezirkr
          POSTGRES_PASSWORD: bezirkr
        ports:
        - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis
        ports:
        - 6379:6379
        options: --entrypoint redis-server

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7

    - name: Install system dependencies via apt
      run: sudo apt-get update && sudo apt-get install --fix-missing -y rsync

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Cache npm
      uses: actions/cache@v6
      env:
        cache-name: cache-npm
      with:
        path: ./node_modules
        key: ${{ env.cache-name }}-v1-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ env.cache-name }}-

    - name: Install js dependencies
      run: yarn

    - name: Prepare DB
      run: bundle exec rails db:create
      env:
        RAILS_ENV: test
    - name: Load schema
      run: bundle exec rails db:schema:load
      env:
        RAILS_ENV: test

    - name: Run system tests
      run: bundle exec rails test:system
      env:
        COVERAGE: on
        CI: on
        RAILS_ENV: test

    - name: Store screenshots
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Screenshots
        path: tmp/screenshots
    - name: Store test results
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: Test Results
        path: test/reports
    - name: Store logs
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: Logs
        path: log

