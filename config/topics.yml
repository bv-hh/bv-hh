# The topics a Drucksache can be tagged with, and the rules that find them.
# See Topic and TopicClassifier. Bump Topic::VERSION after changing anything
# here, then run `rake topics:reassign_later`.
#
# terms          - to_tsquery('german', …) fragments, joined with |, matched
#                  against the title and the full text.
# title_terms    - the same, matched against the title only: words that name
#                  the topic in a title but are mentioned in passing in any
#                  long text ("Verkehr", "Mittel").
# committees     - regular expressions (case-insensitive) against committee
#                  names. Regionalausschüsse are skipped, they have no topic.
# poi_categories - Poi#category values of places linked to the document.
# yields_to      - topics that take precedence: when one of them has a term
#                  in the title, this topic is not assigned.
# yields_unless  - title terms that keep the topic despite yields_to.
# title_patterns - Ruby regular expressions (case-sensitive) against the title
#                  that name a place of the topic, a weak signal like a POI
#                  ("Park" the noun, which stemming merges with "parken").
# description    - what the topic covers, in words: the codebook for labelling
#                  the gold set (db/gold). It decides nothing here, so changing
#                  it needs no bump of Topic::VERSION.
#
# Terms are stemmed and umlauts folded like the text, so "spielplatz:*" matches
# "Spielplätze". German compounds are not split: a prefix finds
# "Fahrradstellplatz", but nothing finds "Durchgangsverkehr" from "verkehr",
# so compounds that start with another word are listed on their own.
# Stemming also merges words: "Park" and "parken" are both 'park', "Müller"
# and "Müll" both 'mull'. A prefix that starts other words can exclude them:
# "(schul:* & !schuld:*)" keeps "Schulden" out.
#
# Committee and street names are removed from the title before matching, so
# "… Beschlussvorlage des Ausschusses für Haushalt und Kultur" is not about
# Kultur and "Schulstraße" not about schools.

